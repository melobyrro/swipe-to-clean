services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_BIND_PORT:-3001}:3001"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: 3001
      APP_SECRET: ${APP_SECRET}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      DATABASE_PATH: /data/swipe-to-clean.db
      REDIS_URL: redis://redis:6379
      REDIS_REQUIRED: "true"
      SESSION_COOKIE_NAME: swipe_to_clean_session
      IMMICH_TIMEOUT_MS: 15000
    volumes:
      - swipe_to_clean_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/readyz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - swipe_to_clean_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  swipe_to_clean_data:
  swipe_to_clean_redis:
